{% extends "base.html" %}

{% block content %}
<main class="px-4 py-8 max-w-screen-xl mx-auto">
  <h1 class="text-3xl font-bold mb-4">{{ page.title }}</h1>

  {% if page.description %}
    <p class="mb-6">{{ page.description }}</p>
  {% endif %}

  <div class="prose dark:prose-invert mb-8">
    {{ page.content | safe }}
  </div>
</main>
{% endblock %}
